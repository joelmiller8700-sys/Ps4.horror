name: Build PS4 Horror3D PKG

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          set -e
          if ! command -v clang >/dev/null 2>&1 || ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang lld
          fi

      - name: Download OpenOrbis Toolchain
        run: |
          set -e
          mkdir -p toolchain
          TAR_URL=$(curl -sL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .browser_download_url' \
            | head -n 1)

          if [ -z "$TAR_URL" ] || [ "$TAR_URL" = "null" ]; then
            echo "ERROR: Could not find OpenOrbis tar.gz release."
            exit 1
          fi

          curl -sL "$TAR_URL" -o toolchain.tar.gz
          tar -xzf toolchain.tar.gz -C toolchain

      - name: Prepare and Build PKG
        env:
          DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
          DOTNET_ROLL_FORWARD: "Major"
        run: |
          set -e
          KERNEL_H=$(find toolchain -path "*/orbis/libkernel.h" | head -n 1)
          if [ -z "$KERNEL_H" ]; then
            echo "ERROR: orbis/libkernel.h not found."
            exit 1
          fi

          export OO_PS4_TOOLCHAIN=$(realpath "$(dirname "$(dirname "$(dirname "$KERNEL_H")")")")
          echo "OO_PS4_TOOLCHAIN=$OO_PS4_TOOLCHAIN"

          find "$OO_PS4_TOOLCHAIN/bin/linux" -type f -exec chmod +x {} +

          rm -rf build_proj
          mkdir -p build_proj
          cp -r "$OO_PS4_TOOLCHAIN/samples/piglet" build_proj/horror3d
          mv build_proj/horror3d/piglet build_proj/horror3d/horror3d

          if [ -d "src" ] && [ -n "$(ls -A src 2>/dev/null)" ]; then
            echo "Copying custom source files from src/..."
            rm -f build_proj/horror3d/horror3d/*.c build_proj/horror3d/horror3d/*.cpp build_proj/horror3d/horror3d/*.h build_proj/horror3d/horror3d/*.hpp
            cp -r src/* build_proj/horror3d/horror3d/
          fi

          cd build_proj/horror3d

          sed -i 's|^TITLE[[:space:]]*:=.*|TITLE       := Horror House 3D|' Makefile
          sed -i 's|^TITLE_ID[[:space:]]*:=.*|TITLE_ID    := HORR00001|' Makefile
          sed -i 's|^CONTENT_ID[[:space:]]*:=.*|CONTENT_ID  := IV0000-HORR00001_00-HORROR3DGAME0001|' Makefile
          sed -i 's|^LIBS[[:space:]]*:=.*|& -lScePad -lSceUserService|' Makefile

          make

          PKG_FILE="IV0000-HORR00001_00-HORROR3DGAME0001.pkg"
          if [ ! -f "$PKG_FILE" ] || [ ! -s "$PKG_FILE" ]; then
            echo "ERROR: Expected PKG file $PKG_FILE was not created!"
            exit 1
          fi

          ls -lh "$PKG_FILE"

      - name: Upload PKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HorrorHouse3D-pkg
          path: build_proj/horror3d/IV0000-HORR00001_00-HORROR3DGAME0001.pkg
