name: Horror start

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Download OpenOrbis toolchain
        run: |
          curl -sL https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest -o rel.json
          URL=$(grep browser_download_url rel.json | grep -i 'tar.gz' | head -1 | cut -d '"' -f4)
          curl -L -o toolchain.tar.gz "$URL"
          mkdir -p toolchain
          tar -xzf toolchain.tar.gz -C toolchain

      - name: Collect samples and build piglet
        run: |
          H=$(find toolchain -path '*orbis/libkernel.h' | head -1)
          export OO_PS4_TOOLCHAIN=$PWD/$(dirname $(dirname $(dirname $H)))
          export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          export DOTNET_ROLL_FORWARD=Major
          chmod +x $OO_PS4_TOOLCHAIN/bin/linux/* || true
          cp -r $OO_PS4_TOOLCHAIN/samples samples
          mkdir -p out
          {
            echo "=== LISTING samples"; ls samples
            echo "=== LISTING toolchain lib"; ls $OO_PS4_TOOLCHAIN/lib
            echo "=== LISTING include/orbis"; ls $OO_PS4_TOOLCHAIN/include/orbis
            echo "=== LISTING piglet files"; find samples/piglet -type f
          } > out/sources.txt
          for d in piglet input _common; do
            find samples/$d -type f \( -name '*.c' -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' -o -name 'Makefile' -o -name '*.glsl' -o -name '*.vert' -o -name '*.frag' \) -size -80k | while read f; do
              echo "=== $f"
              cat "$f"
            done >> out/sources.txt
          done
          cd samples/piglet
          make || true
          cd ../..
          find samples/piglet -name '*.pkg' -exec cp {} out/ \;
          ls -la out

      - name: Upload result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: horror-start
          path: out/*
