name: Dump OpenOrbis Samples

on:
  push:
  workflow_dispatch:

jobs:
  dump_samples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download OpenOrbis Toolchain and Dump Samples
        run: |
          set -e
          echo "Downloading latest OpenOrbis toolchain..."
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest | grep "browser_download_url.*tar.gz" | cut -d '"' -f 4 | head -n 1)
          curl -L -o toolchain.tar.gz "$DOWNLOAD_URL"
          
          mkdir -p toolchain_dir
          tar -xzf toolchain.tar.gz -C toolchain_dir
          
          HEADER_PATH=$(find $(pwd)/toolchain_dir -name "libkernel.h" | grep "orbis/libkernel.h" | head -n 1)
          if [ -z "$HEADER_PATH" ]; then
            echo "Error: Could not find orbis/libkernel.h"
            exit 1
          fi
          
          OO_TOOLCHAIN=$(dirname $(dirname $(dirname $(dirname "$HEADER_PATH"))))
          echo "Found Toolchain Root at: $OO_TOOLCHAIN"
          
          OUT_FILE="$(pwd)/samples_dump.txt"
          echo "=== OPENORBIS SAMPLES DUMP ===" > "$OUT_FILE"
          
          echo "--- ALL DIRECTORIES IN SAMPLES ---" >> "$OUT_FILE"
          find "$OO_TOOLCHAIN/samples" -maxdepth 2 -type d >> "$OUT_FILE" 2>&1 || true
          echo "" >> "$OUT_FILE"
          
          for SAMPLE in piglet input pad audio; do
            echo "==========================================" >> "$OUT_FILE"
            echo "SEARCHING FOR SAMPLE: $SAMPLE" >> "$OUT_FILE"
            echo "==========================================" >> "$OUT_FILE"
            
             matches=$(find "$OO_TOOLCHAIN/samples" -iname "*$SAMPLE*")
             for match in $matches; do
               if [ -d "$match" ]; then
                 echo ">>> Directory: $match" >> "$OUT_FILE"
                 find "$match" -type f \( -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "Makefile" -o -name "*.vert" -o -name "*.frag" \) | while read -r file; do
                   echo "--- FILE: $file ---" >> "$OUT_FILE"
                   cat "$file" >> "$OUT_FILE"
                   echo "" >> "$OUT_FILE"
                 done
               fi
             done
          done

      - name: Upload Samples Dump Artifact
        uses: actions/upload-artifact@v4
        with:
          name: samples-dump
          path: samples_dump.txt
