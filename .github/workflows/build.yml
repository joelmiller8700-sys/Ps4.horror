name: Dump OpenOrbis Samples

on:
  push:
  workflow_dispatch:

jobs:
  dump-samples:
    runs-on: ubuntu-latest

    steps:
      - name: Download OpenOrbis Toolchain
        run: |
          set -e
          mkdir -p toolchain
          TAR_URL=$(curl -sL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest \
            | jq -r '.assets[] | select(.name | endswith(".tar.gz")) | .browser_download_url' \
            | head -n 1)

          echo "Download URL: $TAR_URL"
          if [ -z "$TAR_URL" ] || [ "$TAR_URL" = "null" ]; then
            echo "ERROR: Could not find tar.gz release asset."
            exit 1
          fi

          curl -sL "$TAR_URL" -o toolchain.tar.gz
          tar -xzf toolchain.tar.gz -C toolchain

      - name: Dump Piglet and Input Samples
        run: |
          set -e
          KERNEL_H=$(find toolchain -path "*/orbis/libkernel.h" | head -n 1 || true)
          echo "Found libkernel.h at: $KERNEL_H"

          SAMPLES_DIR=$(find toolchain -maxdepth 4 -type d -name "samples" | head -n 1 || true)
          if [ -z "$SAMPLES_DIR" ]; then
            echo "samples folder not found in tar.gz, cloning repository..."
            git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git repo_tmp
            SAMPLES_DIR="repo_tmp/samples"
          fi

          if [ ! -d "$SAMPLES_DIR" ]; then
            echo "ERROR: Could not find samples directory."
            exit 1
          fi

          OUT="samples_dump.txt"
          {
            echo "=== TOOLCHAIN INFO ==="
            echo "libkernel.h: $KERNEL_H"
            echo "samples dir: $SAMPLES_DIR"
            echo ""
            echo "=== ALL SAMPLE FOLDERS ==="
            find "$SAMPLES_DIR" -maxdepth 2 -mindepth 1 -type d | sort
            echo ""
          } > "$OUT"

          dump_folder() {
            local DIR="$1"
            echo "========================================" >> "$OUT"
            echo "SAMPLE FOLDER: $DIR" >> "$OUT"
            echo "========================================" >> "$OUT"
            echo "--- File List ---" >> "$OUT"
            find "$DIR" -type f | sort >> "$OUT"
            echo "" >> "$OUT"

            find "$DIR" -type f -size -100k \( \
              -name "*.c" -o -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \
              -o -name "Makefile" -o -name "*.mk" -o -name "*.glsl" \
              -o -name "*.vert" -o -name "*.frag" -o -name "*.md" \
              -o -name "*.txt" -o -name "*.sh" \
            \) | sort | while IFS= read -r FILE; do
              echo ">>> BEGIN FILE: $FILE" >> "$OUT"
              cat "$FILE" >> "$OUT"
              echo "" >> "$OUT"
              echo "<<< END FILE: $FILE" >> "$OUT"
              echo "" >> "$OUT"
            done
          }

          FOUND_ANY=0
          while IFS= read -r DIR; do
            NAME=$(basename "$DIR" | tr '[:upper:]' '[:lower:]')
            case "$NAME" in
              *piglet*|*opengl*|*gles*|*pad*|*input*|*controller*)
                dump_folder "$DIR"
                FOUND_ANY=1
                ;;
            esac
          done < <(find "$SAMPLES_DIR" -maxdepth 1 -mindepth 1 -type d | sort)

          if [ "$FOUND_ANY" -eq 0 ]; then
            while IFS= read -r DIR; do
              NAME=$(basename "$DIR" | tr '[:upper:]' '[:lower:]')
              case "$NAME" in
                *piglet*|*opengl*|*gles*|*pad*|*input*|*controller*)
                  dump_folder "$DIR"
                  FOUND_ANY=1
                  ;;
              esac
            done < <(find "$SAMPLES_DIR" -maxdepth 2 -mindepth 2 -type d | sort)
          fi

          if [ "$FOUND_ANY" -eq 0 ]; then
            echo "WARNING: No matching piglet or input sample folder found." >> "$OUT"
          fi

          if [ ! -s "$OUT" ]; then
            echo "ERROR: samples_dump.txt is empty or missing."
            exit 1
          fi

          ls -lh "$OUT"

      - name: Upload Samples Dump
        uses: actions/upload-artifact@v4
        with:
          name: samples-dump
          path: samples_dump.txt
