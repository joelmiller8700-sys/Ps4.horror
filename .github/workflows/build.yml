name: Extract PS4 Samples

on:
  push:
  workflow_dispatch:

jobs:
  extract_samples:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download OpenOrbis Toolchain
        run: |
          curl -fLJO https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.3/toolchain-llvm-18.2.zip
          unzip -q toolchain-llvm-18.2.zip
          tar -xzf toolchain-llvm-18.tar.gz -C ./
          
          # إذا مجلد samples ما موجود كامل بالنسخة المترجمة، نسحبه من مستودع OpenOrbis الرسمي
          if [ ! -d "OpenOrbis/PS4Toolchain/samples/piglet" ]; then
            git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo_repo
            cp -r oo_repo/samples OpenOrbis/PS4Toolchain/
          fi

      - name: Extract Piglet and Input Samples to Text File
        run: |
          OUT="samples_source.txt"
          OO_DIR="$PWD/OpenOrbis/PS4Toolchain"
          
          echo "=== TOOLCHAIN STRUCTURE ===" > "$OUT"
          find "$OO_DIR/samples/piglet" "$OO_DIR/samples/input" -maxdepth 4 >> "$OUT" 2>&1
          
          echo -e "\n\n================ PIGLET SAMPLE ================" >> "$OUT"
          find "$OO_DIR/samples/piglet" -type f \( -name "Makefile" -o -name "*.cpp" -o -name "*.c" -o -name "*.h" -o -name "*.vert" -o -name "*.frag" -o -name "*.glsl" \) | while read -r file; do
            echo -e "\n--- FILE: $file ---" >> "$OUT"
            cat "$file" >> "$OUT"
          done

          echo -e "\n\n================ INPUT SAMPLE ================" >> "$OUT"
          find "$OO_DIR/samples/input" -type f \( -name "Makefile" -o -name "*.cpp" -o -name "*.c" -o -name "*.h" \) | while read -r file; do
            echo -e "\n--- FILE: $file ---" >> "$OUT"
            cat "$file" >> "$OUT"
          done

          echo -e "\n\n================ KEY HEADERS (Pad, Piglet, AudioOut) ================" >> "$OUT"
          for hdr in Pad.h Pigletv2VSH.h AudioOut.h; do
            found=$(find "$OO_DIR/include" -name "$hdr" | head -n 1)
            if [ -n "$found" ]; then
              echo -e "\n--- HEADER: $found ---" >> "$OUT"
              cat "$found" >> "$OUT"
            fi
          done

      - name: Upload Samples Source Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ps4-samples-source
          path: samples_source.txt
